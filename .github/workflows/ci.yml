name: CI 检查

# 默认仅在 push main 或 PR 时执行轻量级 Lint 与编译测试
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端检查 (TypeScript & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与构建
        run: pnpm build

  rust:
    name: 后端检查 (Rust fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 准备占位 dist 目录供 Tauri 编译期宏检查
        run: mkdir -p dist

      - name: 检查代码格式 (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: 静态检查 (clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: 运行单元测试
        working-directory: src-tauri
        run: cargo test
